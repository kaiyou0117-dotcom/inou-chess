<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>異能チェス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="menu.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="title">異能チェス</h1>
      <p class="subtitle">超弩級の異能式チェス — 馬鹿みたいな駒と馬鹿みたいなルールで勝負だ</p>
    </header>

    <main>
      <div class="mode-grid">
        <a class="mode-card" href="formation.html">
          <div class="mode-card-head">
            <h2 class="mode-card-title">編成モード</h2>
            <span class="status-badge ready">プレイ可能</span>
          </div>
          <p class="mode-card-desc">
            全ての駒が解放された状態で対局するモード。現状は初期配置固定で特殊駒のみが並ぶ雛形段階。
            HPダメージ制の戦闘、駒図鑑、対局ログを確認できる。今後、駒を自由に編成できるUIを追加予定。
          </p>
        </a>

        <a class="mode-card" href="roguelike.html">
          <div class="mode-card-head">
            <h2 class="mode-card-title">ローグライクモード</h2>
            <span class="status-badge wip">準備中</span>
          </div>
          <p class="mode-card-desc">
            対局に勝利するごとに新しい駒を獲得し、編成を強化しながら周回していくモード。
            現在は仕様検討中で、対局ロジックは未実装。
          </p>
        </a>
      </div>

      <p class="menu-footer-note">「ここだけ異能のある世界」wiki設定を元にした個人制作のファンゲームです。</p>
    </main>
  </div>
</body>
</html>
